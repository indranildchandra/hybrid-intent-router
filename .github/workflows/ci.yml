name: CI

# Runs on every push and PR. Exercises everything that does not need a GPU, Ollama or the
# Hugging Face checkpoints: Tier 1 rules, Tier 2 models, the calibration tooling, and the full
# cascade ordering with every model tier faked. The `live` suite auto-skips here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps (CPU only, no models)
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -v -m unit

      - name: Calibration example reproduces the article
        run: PYTHONPATH=src python -m hybrid_intent_router.calibration | tee /tmp/cal.txt && grep -q "ECE = 0.061" /tmp/cal.txt

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck run.sh
        run: shellcheck -S warning run.sh
      - name: run.sh --help
        run: ./run.sh --help
